server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    # o próprio server não se registra
    register-with-eureka: false
    fetch-registry: false
  server:
    # demo: tira instância parada do registro logo
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
