server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # lb:// resolve pelo eureka
          routes:
            - id: acompanhamento
              uri: lb://acompanhamento
              predicates:
                - Path=/acompanhamento/**
              filters:
                - StripPrefix=1
            - id: notificacoes
              uri: lb://notificacoes
              predicates:
                - Path=/notificacoes/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
